# Alembic configuration.
#
# NOTE: keep this file ASCII-only. Alembic's Config reads it with the system
# locale encoding (GBK on zh-CN Windows), so non-ASCII bytes crash here.
#
# The DSN is intentionally left empty: migrations/env.py prefers the
# sqlalchemy.url given on the command line, and otherwise falls back to
# core.config (i.e. the repo-root .env). Never put credentials in version control.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

sqlalchemy.url =

[post_write_hooks]

# ------------------------------------------------------------------ logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
