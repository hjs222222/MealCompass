[project]
name = "mealcompass-backend"
version = "0.1.0"
description = "MealCompass 后端：混合检索 + LangGraph Agent 的多约束菜谱规划助手"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langfuse>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# 沙箱会留下不可读的 pytest 临时目录，会让 ruff 扫描崩溃，直接排除
extend-exclude = ["pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
