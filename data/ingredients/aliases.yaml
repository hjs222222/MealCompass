# 食材归一化词典（T1.3）
#
# 用途：
#   1. 把 HowToCook 里五花八门的食材写法收敛到标准名（番茄 = 西红柿）
#   2. 作为 ingredients / ingredient_aliases 表的种子数据（docs/ARCHITECTURE.md §3.1）
#   3. 支撑忌口/过敏过滤的同义词命中（PRD F-D1）与购物清单合并（PRD F-F1）
#
# 维护规则（重要）：
#   - 只合并「同一食材的不同叫法」；**风味 / 品种不同的一律不合并**
#     （生抽 ≠ 老抽，大葱 ≠ 小葱，黑胡椒 ≠ 白胡椒，柠檬 ≠ 青柠）
#   - 别名不得跨条目重复：构造词典时会直接抛 ValueError
#   - category 取值：蔬果 / 肉类 / 水产 / 蛋奶 / 主食 / 豆制品 / 调料 / 干货 / 其他
#   - 新增条目后重跑 `backend/scripts/import_howtocook.py`，看报告里「未归一化」数量是否下降

