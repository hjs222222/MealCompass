# MealCompass 检索评估集（C2 / task-3）
#
# 约束（硬性）：
#   1. 每条 `relevant` 只能是 **库里真实存在的 recipes.name**（先导出全表再人工构造）；
#      校验命令：`python -m scripts.eval --validate-only`
#   2. 每条 1-3 个 relevant，宁少不编。
#   3. 40 条 = 5 类 × 8 条：direct(直接菜名) / ingredients(食材组合) / scene(场景耗时)
#      / taste(口味菜系) / tool(工具做法)。
#
# 评估协议（见 backend/scripts/eval.py）：
#   - 三组模式候选池统一 Top50，指标在 Top5 / Top10 上截断计算，保证横向可比。
#   - relevant 用菜名匹配；库里 `陈皮排骨汤` 有两条同名记录，评估集刻意不收录该菜名。

- id: q001
  category: direct
  query: "西红柿炒鸡蛋怎么做才好吃"
  relevant: ["西红柿炒鸡蛋"]
  notes: "直接点名菜名；库中同名唯一条目，最基础的词汇匹配验收点。"

- id: q002
  category: direct
  query: "宫保鸡丁"
  relevant: ["宫保鸡丁"]
  notes: "川味名菜直接检索；糊辣荔枝味的描述在卡片文档里，向量与 BM25 都应命中。"

